    const templateEl = document.querySelector('script[type="__bundler/template"]');

    const manifest = JSON.parse(manifestEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {

    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.

      ';</' + 'script>';

    // would push the parser into quirks mode. DOMParser always emits a <head>

      window.Babel.transformScriptTags();
    }

    console.error('Bundle unpack error:', err);

r-radius:50%;border:1px solid rgba(255,107,0,0.07);animation:pulse 4s ease-in-out infinite}\n  .r1{width:350px;height:350px;top:50%;left:50%;transform:translate(-50%,-50%)}\n  .r2{width:550px;height:550px;top:50%;left:50%;transform:translate(-50%,-50%);animation-delay:.8s}\n  .r3{width:750px;height:750px;top:50%;left:50%;transform:translate(-50%,-50%);animation-delay:1.6s}\n  .r4{width:950px;height:950px;top:50%;left:50%;transform:translate(-50%,-50%);animation-delay:2.4s}\n  @keyframes pulse{0%,100%{opacity:.3}50%{opacity:.7}}\n  .floaters{position:absolute;inset:0;pointer-events:none;z-index:1}\n  .floater{position:absolute;font-size:32px;animation:float 7s ease-in-out infinite;opacity:.12}\n  .f1{top:10%;left:7%;animation-delay:0s}.f2{top:15%;right:9%;animation-delay:1.2s}.f3{bottom:28%;left:5%;animation-delay:2.4s}.f4{bottom:18%;right:7%;animation-delay:.6s}.f5{top:55%;left:3%;animation-delay:1.8s}.f6{top:38%;right:4%;animation-delay:3s}.f7{bottom:40%;right:12%;animation-delay:0.3s}\n  @keyframes float{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-18px) rotate(6deg)}}\n  .logo-wrap{position:relative;z-index:2;animation:logoIn 1s cubic-bezier(.16,1,.3,1) both}\n  @keyframes logoIn{from{opacity:0;transform:scale(.5) translateY(50px)}to{opacity:1;transform:scale(1) translateY(0)}}\n  .logo-circle{width:210px;height:210px;border-radius:50%;background:var(--dark-navy);border:4px solid var(--orange);display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;overflow:hidden;box-shadow:0 0 0 8px rgba(255,107,0,0.1),0 0 60px rgba(255,107,0,0.2);transition:box-shadow .4s,transform .4s;cursor:default}\n  .logo-circle:hover{box-shadow:0 0 0 12px rgba(255,107,0,0.2),0 0 80px rgba(255,107,0,0.35);transform:scale(1.03)}\n  .logo-city{font-size:52px;line-height:1;margin-bottom:2px}\n  .logo-fork{font-size:14px;color:rgba(255,107,0,0.5);margin:1px 0}\n  .logo-l{font-family:'Dancing Script',cursive;font-size:34px;color:var(--orange);line-height:1}\n  .logo-escale{font-family:'Oswald',sans-serif;font-size:28px;color:white;font-weight:700;letter-spacing:3px;line-height:1}\n  .logo-42{font-family:'Oswald',sans-serif;font-size:44px;color:var(--orange);font-weight:700;line-height:1}\n  .hero-tagline{position:relative;z-index:2;margin-top:30px;text-align:center;animation:fadeUp .8s .4s both}\n  @keyframes fadeUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}\n  .hero-tagline h1{font-family:'Oswald',sans-serif;font-size:clamp(30px,6vw,56px);font-weight:700;color:white;letter-spacing:-1px;line-height:1}\n  .hero-tagline h1 span{color:var(--orange)}\n  .hero-tagline p{color:rgba(255,255,255,0.45);font-size:12px;letter-spacing:5px;text-transform:uppercase;margin-top:10px}\n  .hero-chips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:18px;animation:fadeUp .8s .5s both}\n  .chip{border:1px solid rgba(255,107,0,0.25);color:rgba(255,255,255,0.6);padding:5px 14px;border-radius:20px;font-size:12px;transition:all .2s;cursor:default}\n  .chip:hover{border-color:var(--orange);color:white;background:rgba(255,107,0,0.1)}\n  .hero-ctas{display:flex;gap:12px;margin-top:26px;justify-content:center;flex-wrap:wrap;position:relative;z-index:2;animation:fadeUp .8s .6s both}\n  .btn-primary{background:var(--orange);color:white;border:none;padding:13px 34px;font-family:'Oswald',sans-serif;font-size:14px;letter-spacing:2px;text-transform:uppercase;cursor:pointer;clip-path:polygon(6px 0%,100% 0%,calc(100% - 6px) 100%,0% 100%);transition:all .2s}\n  .btn-primary:hover{background:#e05500;transform:translateY(-2px)}\n  .btn-secondary{background:transparent;color:white;border:1px solid rgba(255,255,255,0.2);padding:13px 34px;font-family:'Oswald',sans-serif;font-size:14px;letter-spacing:2px;text-transform:uppercase;cursor:pointer;transition:all .2s}\n  .btn-secondary:hover{border-color:var(--orange);color:var(--orange)}\n  .hero-info{display:flex;gap:24px;marg div class=\"hour-row\"><span class=\"day\">Mardi<\u002Fspan><span class=\"time\">11h00 – 02h00<\u002Fspan><\u002Fdiv>\n        <div class=\"hour-row\"><span class=\"day\">Mercredi<\u002Fspan><span class=\"time\">11h00 – 02h00<\u002Fspan><\u002Fdiv>\n        <div class=\"hour-row\"><span class=\"day\">Jeudi<\u002Fspan><span class=\"time\">11h00 – 02h00<\u002Fspan><\u002Fdiv>\n        <div class=\"hour-row\"><span class=\"day\" style=\"color:var(--orange)\">Vendredi<\u002Fspan><span class=\"time\">15h00 – 02h00<\u002Fspan><\u002Fdiv>\n        <div class=\"hour-row\"><span class=\"day\">Samedi<\u002Fspan><span class=\"time\">11h00 – 02h00<\u002Fspan><\u002Fdiv>\n        <div class=\"hour-row\"><span class=\"day\">Dimanche<\u002Fspan><span class=\"time\">11h00 – 02h00<\u002Fspan><\u002Fdiv>\n        <div style=\"margin-top:12px;font-size:12px;color:rgba(255,255,255,0.25)\">Ouvert 7 jours sur 7<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<footer>\n  <p><strong>L'Escale 42<\u002Fstrong> · 50 Rue de Clermont, 42300 Roanne<\u002Fp>\n  <p style=\"margin-top:4px\">📞 04 77 60 84 52 &nbsp;·&nbsp; Ouvert 7j/7 de 11h00 à 02h00<\u002Fp>\n  <p style=\"margin-top:4px\">Rejoignez-nous sur Uber Eats &amp; Deliveroo<\u002Fp>\n<\u002Ffooter>\n\n<script>\n  /* ======= Tab switcher (avec stagger sur panel) ======= */\n  function show(name, btn) {\n    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));\n    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));\n    var panel = document.getElementById('tab-' + name);\n    panel.classList.add('active');\n    btn.classList.add('active');\n    /* stagger les enfants directs des grids dans le panel actif */\n    staggerChildren(panel);\n  }\n\n  function staggerChildren(root){\n    var grids = root.querySelectorAll('.grid, .pizza-list, .item-list, .smash-grid, .sides-grid, .tacos-grid, .pill-row, .menu-pizza-boxes');\n    grids.forEach(function(g){\n      Array.from(g.children).forEach(function(child, i){\n        child.style.opacity = '0';\n        child.style.transform = 'translateY(20px) scale(.97)';\n        child.style.transition = 'opacity .55s cubic-bezier(.16,1,.3,1), transform .55s cubic-bezier(.16,1,.3,1)';\n        child.style.transitionDelay = (i * 0.04) + 's';\n        // force reflow\n        void child.offsetWidth;\n        requestAnimationFrame(function(){\n          child.style.opacity = '1';\n          child.style.transform = 'translateY(0) scale(1)';\n        });\n      });\n    });\n  }\n\n  /* ======= Nav border on scroll ======= */\n  var nav = document.querySelector('nav');\n  window.addEventListener('scroll', function() {\n    nav.style.borderBottomColor = window.scrollY > 60 ? 'rgba(255,107,0,0.6)' : 'rgba(255,107,0,0.3)';\n    nav.style.background = window.scrollY > 60 ? 'rgba(13,17,23,0.98)' : 'rgba(13,17,23,0.95)';\n  });\n\n  /* ======= Hero h1 : split en lettres animées ======= */\n  (function splitHeroH1(){\n    var h1 = document.getElementById('hero-h1');\n    if(!h1) return;\n    var html = '';\n    var nodes = Array.from(h1.childNodes);\n    var letterIdx = 0;\n    nodes.forEach(function(n){\n      if(n.nodeType === 3){ // text\n        Array.from(n.textContent).forEach(function(ch){\n          if(ch === ' '){ html += '<span class=\"ltr\" style=\"width:.4em;display:inline-block\">&nbsp;<\u002Fspan>'; letterIdx++; return; }\n          html += '<span class=\"ltr\" style=\"animation-delay:'+(0.4 + letterIdx*0.05)+'s\">'+ch+'<\u002Fspan>';\n          letterIdx++;\n        });\n      } else if(n.nodeName === 'SPAN'){\n        var wrap = '<span style=\"color:var(--orange)\">';\n        Array.from(n.textContent).forEach(function(ch){\n          if(ch === ' '){ wrap += '<span class=\"ltr\" style=\"width:.4em;display:inline-block\">&nbsp;<\u002Fspan>'; letterIdx++; return; }\n          wrap += '<span class=\"ltr\" style=\"animation-delay:'+(0.4 + letterIdx*0.05)+'s\">'+ch+'<\u002Fspan>';\n          letterIdx++;\n        });\n        wrap += '<\u002Fspan>';\n        html += wrap;\n      }\n    });\n    h1.innerHTML = html;\n  })();\n\n  /* ======= Scroll reveals ======= */\n  var io = new IntersectionObserver(function(entries){\n    entries.forEach(function(e){\n      if(e.isIntersecting){\n        e.target.classList.add('in');\n        // si la cible contient un sec-title em, retrigger drip\n        var em = e.target.querySelector('.sec-title em');\n        if(em){ em.classList.remove('dripped'); void em.offsetWidth; em.classList.add('dripped'); }\n        io.unobserve(e.target);\n      }\n    });\n  }, {threshold:0.15, rootMargin:'0px 0px -60px 0px'});\n  document.querySelectorAll('.reveal, .reveal-left, .reveal-zoom, .stagger').forEach(function(el){ io.observe(el); });\n\n  /* ======= Stagger initial sur le panel \"gratins\" déjà actif ======= */\n  window.addEventListener('load', function(){\n    var initial = document.querySelector('.panel.active');\n    if(initial) setTimeout(function(){ staggerChildren(initial); }, 300);\n  });\n\n  /* ======= Floaters parallax léger au scroll ======= */\n  var floaters = document.querySelectorAll('.floater');\n  window.addEventListener('scroll', function(){\n    var y = window.scrollY;\n    if(y > 800) return; // skip hors hero\n    floaters.forEach(function(f, i){\n      var speed = 0.15 + (i % 3) * 0.08;\n      f.style.transform = 'translateY(' + (y * speed) + 'px)';\n    });\n  }, {passive:true});\n\n  /* ======= Hero ring : pulse au mouvement souris (subtil) ======= */\n  var hero = document.querySelector('.hero');\n  if(hero){\n    hero.addEventListener('mousemove', function(e){\n      var rect = hero.getBoundingClientRect();\n      var x = ((e.clientX - rect.left) / rect.width - .5) * 18;\n      var y = ((e.clientY - rect.top) / rect.height - .5) * 18;\n      var logo = hero.querySelector('.logo-circle');\n      if(logo) logo.style.transform = 'translate('+x+'px,'+y+'px)';\n    });\n    hero.addEventListener('mouseleave', function(){\n      var logo = hero.querySelector('.logo-circle');\n      if(logo) logo.style.transform = '';\n    });\n  }\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
